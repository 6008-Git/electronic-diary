<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#b3442f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>一日手账</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --paper:#f6f1e6;
    --card:#fffdf7;
    --line:#e7dcc7;
    --ink:#3a332a;
    --ink-soft:#8a7d68;
    --ink-faint:#b3a68e;
    --red:#b3442f;
    --red-deep:#8c2f20;
    --red-soft:#f3e2dc;
    --shadow:0 1px 2px rgba(90,70,40,.06),0 6px 18px rgba(90,70,40,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--paper);
    background-image:radial-gradient(rgba(120,95,55,.05) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--paper) 78%,rgba(246,241,230,0));
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
  }
  .date-big{font-size:1.9rem;font-weight:700;letter-spacing:.06em;color:var(--ink)}
  .date-big em{font-style:normal;color:var(--red)}
  .date-sub{margin-top:3px;font-size:.78rem;color:var(--ink-soft);letter-spacing:.18em}
  .save-tip{float:right;font-size:.7rem;color:var(--ink-faint);margin-top:10px;letter-spacing:.05em}

  main{padding:2px 16px 0;max-width:560px;margin:0 auto}
  .page{display:none;animation:fade .25s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px 16px 14px;
    margin-bottom:14px;
    position:relative;
  }
  .card.taped::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-1.5deg);
    width:74px;height:18px;background:rgba(210,190,150,.45);
    border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);
    border-radius:2px;
  }
  .card.taped:nth-of-type(even)::before{transform:translateX(-50%) rotate(2deg)}
  .sec-title{
    display:flex;align-items:baseline;gap:8px;
    font-size:1.02rem;font-weight:700;letter-spacing:.12em;
    padding-bottom:9px;margin-bottom:12px;
    border-bottom:1px dashed var(--line);
  }
  .sec-title .no{
    font-size:.72rem;color:var(--red);border:1px solid var(--red);
    border-radius:50%;width:20px;height:20px;min-width:20px;
    display:inline-flex;align-items:center;justify-content:center;
    letter-spacing:0;transform:translateY(-1px);
  }
  .sec-extra{margin-left:auto;font-size:.9rem;color:var(--red);font-weight:700;letter-spacing:0}

  .field-row{display:flex;align-items:flex-end;gap:10px}
  .line-input{
    flex:1;border:none;border-bottom:1.5px solid var(--ink-faint);
    background:transparent;font-size:1.5rem;color:var(--ink);
    padding:4px 2px 5px;outline:none;border-radius:0;
    font-family:inherit;transition:border-color .2s;min-width:0;
  }
  .line-input:focus{border-bottom-color:var(--red)}
  .line-input::placeholder{color:var(--ink-faint);font-size:1rem}
  .unit{font-size:.85rem;color:var(--ink-soft);padding-bottom:7px;letter-spacing:.05em}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}

  .exp-row{
    display:flex;gap:8px;align-items:center;
    background:#fbf7ec;border:1px solid var(--line);
    border-radius:12px;padding:9px 10px;margin-bottom:8px;
  }
  .exp-cat{
    width:74px;min-width:74px;border:none;background:var(--red-soft);color:var(--red-deep);
    font-size:.82rem;font-weight:600;border-radius:8px;padding:7px 6px;text-align:center;outline:none;
  }
  .exp-cat.custom{background:#ece4d2;color:var(--ink)}
  .exp-amt-wrap{display:flex;align-items:baseline;gap:2px;width:88px;min-width:88px}
  .exp-amt-wrap .yen{font-size:.85rem;color:var(--ink-soft)}
  .exp-amt{
    width:100%;border:none;border-bottom:1.5px solid var(--ink-faint);background:transparent;
    font-size:1.05rem;font-weight:600;color:var(--ink);padding:2px 1px 3px;outline:none;text-align:right;
  }
  .exp-amt:focus{border-bottom-color:var(--red)}
  .exp-note{
    flex:1;min-width:0;border:none;background:transparent;font-size:.85rem;color:var(--ink-soft);
    border-bottom:1px dashed var(--line);padding:4px 2px;outline:none;
  }
  .exp-note::placeholder{color:var(--ink-faint)}
  .exp-del{
    border:none;background:none;color:var(--ink-faint);font-size:1.05rem;
    width:26px;height:26px;min-width:26px;border-radius:50%;line-height:1;cursor:pointer;
  }
  .exp-del:active{background:var(--red-soft);color:var(--red)}
  .exp-del.locked{color:var(--ink-faint);opacity:.28;cursor:default}
  .exp-del.locked:active{background:none;color:var(--ink-faint)}
  .add-row{
    width:100%;border:1.5px dashed var(--ink-faint);background:transparent;color:var(--ink-soft);
    border-radius:12px;padding:10px;font-size:.85rem;letter-spacing:.1em;cursor:pointer;margin-top:2px;
  }
  .add-row:active{border-color:var(--red);color:var(--red)}

  .toolbar{
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px;
  }
  .tool-btn{
    border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
    min-width:34px;height:30px;border-radius:8px;font-size:.82rem;cursor:pointer;padding:0 9px;
  }
  .tool-btn:active{background:var(--red-soft);border-color:var(--red)}
  .color-dot{
    width:22px;height:22px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;
  }
  .color-dot:active{transform:scale(1.15)}
  .editor{
    /* 随内容自动增高：不设 max-height / overflow，避免出现滚动条 */
    min-height:150px;
    font-size:.95rem;line-height:1.9;color:var(--ink);
    /* 横线步长与行高严格一致（同用 1.9em），保证文字始终压在横线上 */
    background:
      repeating-linear-gradient(transparent,transparent calc(1.9em - 1px),rgba(179,166,142,.28) calc(1.9em - 1px),rgba(179,166,142,.28) 1.9em);
    background-attachment:local;
  }
  /* 每一行（标签行 / 自由记录块）都严格占 1.9em 的整数倍，背景横线才不会错位 */
  .thought-row{
    display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:start;
    gap:8px;min-height:1.9em;
  }
  .thought-tag{
    display:inline-flex;align-items:center;padding:0 8px;
    /* 高度锁定为一行行高，垂直居中，避免撑高整行 */
    height:1.9em;
    border-radius:999px;font-size:.8em;font-weight:700;line-height:1;white-space:nowrap;
    user-select:none;-webkit-user-select:none;
  }
  .tag-blue{color:#3a6ea5;background:#e7f0f8;border:1px solid #c9ddec}
  .tag-green{color:#4e7d4e;background:#eaf0e6;border:1px solid #d4e0ce}
  .tag-red{color:#c0392b;background:#f7e7e3;border:1px solid #edcbc3}
  .thought-content,.thought-free{
    min-width:0;min-height:1.9em;outline:none;overflow-wrap:anywhere;white-space:pre-wrap;
    line-height:1.9;   /* 与容器、横线步长一致 */
  }
  .thought-content[contenteditable="true"]:focus,.thought-free:focus{
    background:rgba(255,253,247,.72);box-shadow:inset 0 -1px var(--red);
  }
  .thought-content[contenteditable="true"]:empty::before,.thought-free:empty::before{
    content:attr(data-placeholder);color:var(--ink-faint);pointer-events:none;
  }
  .thought-content.readonly{color:var(--ink-soft);cursor:default}
  .thought-free{margin-top:.1rem}
  .thought-content p,.thought-content div,.thought-free p,.thought-free div{margin:0}

  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,253,247,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1;border:none;background:none;padding:9px 0 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-faint);font-size:.68rem;letter-spacing:.14em;
  }
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--red)}
  .tab.on svg{stroke-width:2}

  .month-label{
    font-size:.78rem;color:var(--ink-soft);letter-spacing:.22em;
    margin:16px 4px 8px;display:flex;align-items:center;gap:10px;
  }
  .month-label::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .hist-item{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;cursor:pointer;
  }
  .hist-day{
    font-size:1.05rem;font-weight:700;color:var(--red);min-width:52px;text-align:center;
    border-right:1px dashed var(--line);padding-right:12px;letter-spacing:.02em;
  }
  .hist-day small{display:block;font-size:.66rem;color:var(--ink-faint);font-weight:400;letter-spacing:.1em;margin-top:2px}
  .hist-meta{flex:1;min-width:0}
  .hist-chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-size:.68rem;padding:3px 8px;border-radius:20px;background:#f1ead9;color:var(--ink-soft);white-space:nowrap;
  }
  .chip.hot{background:var(--red-soft);color:var(--red-deep)}
  .hist-feel{
    margin-top:6px;font-size:.76rem;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .empty{
    text-align:center;color:var(--ink-faint);font-size:.85rem;
    padding:60px 20px;line-height:2;letter-spacing:.1em;
  }
  .edit-banner{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--red-soft);border:1px dashed var(--red);color:var(--red-deep);
    border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:.8rem;
  }
  .edit-banner button{border:none;background:var(--red);color:#fff;border-radius:8px;padding:5px 12px;font-size:.75rem;cursor:pointer}

  .stat-grid{display:flex;gap:10px;margin-bottom:14px}
  .stat-box{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:14px 8px;text-align:center;
  }
  .stat-box b{display:block;font-size:1.4rem;color:var(--red);font-weight:700}
  .stat-box span{font-size:.66rem;color:var(--ink-soft);letter-spacing:.1em}

  .seg{
    margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .seg button{
    border:none;background:#fbf7ec;color:var(--ink-soft);font-size:.72rem;
    padding:4px 12px;cursor:pointer;letter-spacing:.05em;
  }
  .seg button.on{background:var(--red);color:#fff}
  .chart-box{width:100%;overflow-x:auto}
  .chart-box svg{display:block;width:100%;height:auto}
  .chart-empty{
    text-align:center;color:var(--ink-faint);font-size:.78rem;padding:26px 0;letter-spacing:.15em;
  }

  .sync-row{display:flex;gap:8px;margin-bottom:8px}
  .sync-row input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fbf7ec;
    padding:10px 12px;font-size:.88rem;color:var(--ink);outline:none;
  }
  .sync-row input:focus{border-color:var(--red)}
  .sync-row button{
    border:none;background:var(--red);color:#fff;border-radius:10px;
    padding:0 16px;font-size:.82rem;cursor:pointer;white-space:nowrap;
  }
  .sync-row button.ghost{background:#ece4d2;color:var(--ink)}
  .sync-status{font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em;line-height:1.7}
  .sync-status.ok{color:#5c7052}
  .sync-status.err{color:var(--red)}

  .menu-item{
    width:100%;display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:15px 16px;margin-bottom:10px;
    font-size:.92rem;color:var(--ink);cursor:pointer;text-align:left;
  }
  .menu-item svg{width:19px;height:19px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;min-width:19px}
  .menu-item small{margin-left:auto;color:var(--ink-faint);font-size:.72rem}
  .menu-item.danger svg{stroke:#999}
  .menu-item.danger{color:#999}

  #toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fdf9f0;font-size:.82rem;padding:10px 20px;border-radius:24px;
    opacity:0;pointer-events:none;transition:.3s;z-index:99;letter-spacing:.06em;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mask{
    position:fixed;inset:0;background:rgba(50,40,25,.45);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .mask.show{display:flex}
  #mask{z-index:70} /* 确认弹窗始终在最上层 */
  .sheet{
    background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:up .25s ease;max-height:82vh;overflow-y:auto;
  }
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{font-size:1rem;margin-bottom:8px;letter-spacing:.1em}
  .sheet p{font-size:.8rem;color:var(--ink-soft);line-height:1.8;margin-bottom:18px}
  .sheet .btns{display:flex;gap:10px;margin-top:16px}
  .sheet .btns button{
    flex:1;padding:12px;border-radius:12px;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
  }
  .sheet .btns button.primary{background:var(--red);border-color:var(--red);color:#fff}

  .detail-date{font-size:1.25rem;font-weight:700;letter-spacing:.08em;margin-bottom:2px}
  .detail-date em{font-style:normal;color:var(--red)}
  .detail-sub{font-size:.72rem;color:var(--ink-soft);letter-spacing:.15em;margin-bottom:14px}
  .detail-sec{border-top:1px dashed var(--line);padding:10px 0}
  .detail-sec:first-of-type{border-top:none}
  .detail-label{font-size:.72rem;color:var(--ink-faint);letter-spacing:.2em;margin-bottom:6px}
  .detail-val{font-size:1.05rem;font-weight:600}
  .detail-val small{font-size:.72rem;color:var(--ink-soft);font-weight:400}
  .d-exp{display:flex;font-size:.85rem;padding:4px 0;gap:8px;align-items:baseline}
  .d-exp .cat{color:var(--red-deep);font-weight:600;min-width:52px}
  .d-exp .amt{font-weight:700}
  .d-exp .note{color:var(--ink-soft);font-size:.76rem;margin-left:auto;text-align:right}
  .d-total{text-align:right;font-size:.82rem;color:var(--red);font-weight:700;margin-top:4px}
  .d-base-chip{
    display:inline-block;font-size:.76rem;color:#5c7052;background:#eaf0e6;
    border-radius:20px;padding:3px 10px;margin:0 6px 5px 0;
  }
  .detail-feel{font-size:.9rem;line-height:1.9;color:var(--ink)}
  .move-row{display:flex;gap:8px}
  .move-row input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fbf7ec;
    padding:9px 12px;font-size:.88rem;color:var(--ink);outline:none;font-family:inherit;
  }
  .move-row input:focus{border-color:var(--red)}
  .move-row button{
    border:none;background:var(--red);color:#fff;border-radius:10px;
    padding:0 18px;font-size:.85rem;cursor:pointer;white-space:nowrap;
  }

  /* 顶栏右侧：保存按钮 */
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .btn-save{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--red);background:var(--card);color:var(--red);
    border-radius:20px;padding:7px 15px;font-size:.8rem;font-weight:600;letter-spacing:.1em;
    cursor:pointer;box-shadow:var(--shadow);transition:.18s;margin-top:5px;white-space:nowrap;
  }
  .btn-save svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn-save:active{transform:scale(.96)}
  .btn-save.saved{background:var(--red);color:#fff}

  /* 今日基础：单选项 */
  .base-item{
    display:flex;align-items:center;gap:11px;
    padding:11px 4px;cursor:pointer;user-select:none;
    border-bottom:1px dashed var(--line);
  }
  .base-item:last-child{border-bottom:none}
  .base-item .box{
    width:19px;height:19px;min-width:19px;border:1.8px solid var(--red);
    border-radius:5px;position:relative;transition:.18s;background:transparent;
  }
  .base-item .box::after{
    content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);
    transition:transform .18s;
  }
  .base-item .name{font-size:.95rem;color:var(--red);letter-spacing:.08em;transition:.18s}
  .base-item.on .box{background:#5c7052;border-color:#5c7052}
  .base-item.on .box::after{transform:rotate(45deg) scale(1)}
  .base-item.on .name{color:#5c7052;font-weight:600}
  .base-item.on .name::after{content:"  ✓";font-size:.78rem}

  .placeholder-hint{font-size:.74rem;color:var(--ink-faint);letter-spacing:.14em;padding:4px 0}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div>
      <div class="date-big serif" id="dateBig"></div>
      <div class="date-sub serif" id="dateSub"></div>
    </div>
    <div style="text-align:right">
      <button class="btn-save" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        <span id="saveBtnText">保存</span>
      </button>
      <div class="save-tip" id="saveTip" style="float:none;margin-top:6px"></div>
    </div>
  </div>
</header>

<main>
  <!-- ======== 今日 ======== -->
  <section class="page on" id="page-today">
    <div class="edit-banner" id="editBanner" style="display:none">
      <span id="editBannerText"></span>
      <button id="backToday">回到今天</button>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">壹</span>今日体重</div>
      <div class="field-row">
        <input class="line-input" id="inpWeight" type="number" inputmode="decimal" step="0.1" placeholder="称一称，记下来">
        <span class="unit">kg</span>
      </div>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">贰</span>今日消费<span class="sec-extra" id="expTotal"></span></div>
      <div id="expList"></div>
      <button class="add-row" id="btnAddExp">＋ 添一笔</button>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">叁</span>今日单词</div>
      <div class="field-row">
        <input class="line-input" id="inpWords" type="number" inputmode="numeric" step="1" placeholder="今天背了几个">
        <span class="unit">个</span>
      </div>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">肆</span>今日基础</div>
      <div id="baseList"></div>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">伍</span>今日锻炼</div>
      <div id="exerList"></div>
      <p class="placeholder-hint">暂无内容，后续扩展</p>
    </div>

    <div class="card taped">
      <div class="sec-title serif"><span class="no">陆</span>今日感想</div>
      <div class="toolbar">

<script>
(function(){
"use strict";
var STORE_KEY = "一日手账-data";
var CODE_KEY = "一日手账-sync-code";
var SYNCTIME_KEY = "一日手账-sync-time";
var $ = function(id){ return document.getElementById(id); };

function pad(n){ return n<10 ? "0"+n : ""+n; }
function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtMoney(n){ return (Math.round(n*100)/100).toString(); }
var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
var WD = "日一二三四五六";

/* 凌晨4点之前，记为前一天 */
function logicalToday(){
  var n = new Date();
  if(n.getHours() < 4) n = new Date(n.getTime() - 86400000);
  return dateStr(n);
}
var editingDate = logicalToday();

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveAll(data){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

function blankThoughts(){
  return { "今日饮食":"", "今日饮食自动":"", "今日感悟":"", "自由记录":"" };
}
function blankEntry(){
  return {
    "体重":"",
    "消费":[ {"类别":"午饭","金额":"","备注":""}, {"类别":"晚饭","金额":"","备注":""} ],
    "英语单词":"",
    "今日基础": { "刷牙":false, "洗脸":false, "护肤":false, "戒欲":false },
    "今日锻炼": "",
    "感想":blankThoughts(),
    "更新时间":null
  };
}
var BASE_ITEMS = ["刷牙","洗脸","护肤","戒欲"];
var SK = {
  diet: { "id":"sk-diet", "label":"今日饮食", "tagClass":"tag-blue" },
  prev: { "id":"sk-prev", "label":"昨日感悟", "tagClass":"tag-green" },
  feel: { "id":"sk-feel", "label":"今日感悟", "tagClass":"tag-red" }
};

function escHtml(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function htmlText(html){
  var tmp = document.createElement("div");
  tmp.innerHTML = html || "";
  return tmp.textContent.replace(/\xa0/g," ").replace(/\s+/g," ").trim();
}
function cleanFragment(html){
  var tmp = document.createElement("div");
  tmp.innerHTML = html || "";
  tmp.querySelectorAll("script,style,iframe,object,embed,link,meta,img,video,audio").forEach(function(el){ el.remove(); });
  var allowed = { B:1, STRONG:1, I:1, EM:1, U:1, SPAN:1, DIV:1, P:1, BR:1 };
  Array.prototype.slice.call(tmp.querySelectorAll("*")).forEach(function(el){
    if(!allowed[el.tagName]){
      while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.remove();
      return;
    }
    var styles = [];
    ["color","font-weight","font-style","text-decoration","text-decoration-line"].forEach(function(name){
      var value = el.style && el.style.getPropertyValue(name);
      if(value && !/url\s*\(/i.test(value)) styles.push(name+":"+value);
    });
    Array.prototype.slice.call(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    if(styles.length) el.setAttribute("style", styles.join(";"));
  });
  if(!tmp.textContent.replace(/\xa0/g," ").trim() && !tmp.querySelector("br")) return "";
  return tmp.innerHTML;
}
function legacyThoughts(html){
  var out = blankThoughts();
  if(!html) return out;
  var tmp = document.createElement("div");
  tmp.innerHTML = html;
  var diet = tmp.querySelector("#sk-diet-c");
  var feel = tmp.querySelector("#sk-feel-c");
  if(!diet && !feel){
    out["今日感悟"] = cleanFragment(html);
    return out;
  }
  if(diet) out["今日饮食"] = cleanFragment(diet.innerHTML);
  if(feel) out["今日感悟"] = cleanFragment(feel.innerHTML);
  ["sk-diet","sk-prev","sk-feel"].forEach(function(id){
    var tag = tmp.querySelector("#"+id);
    if(tag && tag.parentNode) tag.parentNode.remove();
  });
  out["自由记录"] = cleanFragment(tmp.innerHTML);
  out["今日饮食自动"] = htmlText(out["今日饮食"]);
  return out;
}
function normalizeThoughts(entry){
  var raw = entry && entry["感想"];
  if(raw && typeof raw === "object" && !Array.isArray(raw)){
    var normalized = blankThoughts();
    ["今日饮食","今日饮食自动","今日感悟","自由记录"].forEach(function(k){
      if(raw[k] != null) normalized[k] = String(raw[k]);
    });
    entry["感想"] = normalized;
    return normalized;
  }
  var migrated = legacyThoughts(typeof raw === "string" ? raw : "");
  if(entry) entry["感想"] = migrated;
  return migrated;
}
function previousDate(ds){
  var d = new Date(ds+"T12:00:00");
  d.setDate(d.getDate()-1);
  return dateStr(d);
}
function prevThoughtFor(ds){
  var prev = previousDate(ds);
  var entry = load()[prev];
  var html = entry ? normalizeThoughts(entry)["今日感悟"] : "";
  return { date:prev, html:cleanFragment(html), text:htmlText(html) };
}
var current = null;
function getEntry(){
  if(!current){
    current = load()[editingDate] || blankEntry();
  }
  if(!Array.isArray(current["消费"])) current["消费"] = blankEntry()["消费"];
  /* 旧数据补齐新字段 */
  if(!current["今日基础"] || typeof current["今日基础"] !== "object"){
    current["今日基础"] = { "刷牙":false, "洗脸":false, "护肤":false, "戒欲":false };
  }
  BASE_ITEMS.forEach(function(k){
    if(typeof current["今日基础"][k] !== "boolean") current["今日基础"][k] = false;
  });
  if(current["今日锻炼"] === undefined || current["今日锻炼"] === null) current["今日锻炼"] = "";
  var thoughts = normalizeThoughts(current);
  /* 首次进入（饮食为空且无自动记录）时，用消费备注初始化自动部分 */
  if(!htmlText(thoughts["今日饮食"]) && !htmlText(thoughts["今日饮食自动"])){
    var auto0 = dietFromExpenses(current);
    thoughts["今日饮食自动"] = auto0;
    thoughts["今日饮食"] = escHtml(auto0);
  }
  return current;
}
function resetCurrent(){ current = null; }
function persist(){
  var data = load();
  var e = getEntry();
  var thoughts = normalizeThoughts(e);
  e["更新时间"] = new Date().toISOString();
  var empty = (e["体重"]===""||e["体重"]==null) && (e["英语单词"]===""||e["英语单词"]==null)
    && (e["今日锻炼"]===""||e["今日锻炼"]==null)
    && !BASE_ITEMS.some(function(k){ return e["今日基础"] && e["今日基础"][k]; })
    && !["今日饮食","今日感悟","自由记录"].some(function(k){ return htmlText(thoughts[k]); })
    && e["消费"].every(function(r){ return (r["金额"]===""||r["金额"]==null) && !(r["备注"]||"").trim(); });
  if(empty && editingDate!==logicalToday()){ delete data[editingDate]; }
  else { data[editingDate] = e; }
  saveAll(data);
}

function renderHeader(){
  var d = new Date(editingDate+"T00:00:00");
  $("dateBig").innerHTML = (d.getMonth()+1)+"月<em>"+d.getDate()+"</em>日";
  var dayOfYear = Math.floor((d - new Date(d.getFullYear(),0,0))/86400000);
  var sub = d.getFullYear()+" · "+WEEK[d.getDay()]+" · 今年第 "+dayOfYear+" 天";
  if(editingDate===logicalToday() && new Date().getHours()<4) sub += " · 凌晨记昨日";
  $("dateSub").textContent = sub;
  $("editBanner").style.display = editingDate===logicalToday() ? "none" : "flex";
  $("editBannerText").textContent = "正在补记 "+editingDate+" 的日记";
}

/* ---------- 保存 & 云同步触发 ---------- */
var saveTimer = null, syncTimer = null;
function touched(){
  persist();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var n = new Date();
    $("saveTip").textContent = "已存 "+pad(n.getHours())+":"+pad(n.getMinutes());
  }, 350);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncNow(false); }, 5000);
}

/* ---------- 感想：固定标签 + 独立内容区 ---------- */
/* 根据消费备注生成"今日饮食"内容（分号间隔） */
function dietFromExpenses(e){
  var parts = [];
  (e["消费"]||[]).forEach(function(r){
    var n = (r["备注"]||"").trim();
    if(n) parts.push(n);
  });
  return parts.join("；");
}
function thoughtRow(cfg, body, editable){
  return '<div class="thought-row" data-section="'+cfg.id+'">' +
    '<span class="thought-tag '+cfg.tagClass+'" contenteditable="false">'+cfg.label+'</span>' +
    '<div id="'+cfg.id+'-c" class="thought-content'+(editable?' thought-editable':' readonly')+'" contenteditable="'+(editable?'true':'false')+'"'+
      (editable?' data-placeholder="在这里填写…"':'')+'>'+body+'</div></div>';
}
function renderThoughtEditor(e){
  var thoughts = normalizeThoughts(e);
  var prev = prevThoughtFor(editingDate);
  activeThoughtEditor = null;
  $("editor").innerHTML = thoughtRow(SK.diet, thoughts["今日饮食"], true) +
    thoughtRow(SK.prev, prev.html, false) +
    thoughtRow(SK.feel, thoughts["今日感悟"], true) +
    '<div id="sk-free-c" class="thought-free thought-editable" contenteditable="true" data-placeholder="继续写点别的…">'+thoughts["自由记录"]+'</div>';
}
function saveThoughtEditor(){
  var thoughts = normalizeThoughts(getEntry());
  thoughts["今日饮食"] = cleanFragment($("sk-diet-c").innerHTML);
  thoughts["今日感悟"] = cleanFragment($("sk-feel-c").innerHTML);
  thoughts["自由记录"] = cleanFragment($("sk-free-c").innerHTML);
}
function renderThoughtDetail(e, ds){
  var thoughts = normalizeThoughts(e);
  return thoughtRow(SK.diet, thoughts["今日饮食"], false) +
    thoughtRow(SK.prev, prevThoughtFor(ds).html, false) +
    thoughtRow(SK.feel, thoughts["今日感悟"], false) +
    (thoughts["自由记录"] ? '<div class="thought-free">'+thoughts["自由记录"]+'</div>' : "");
}
/* 实时同步"今日饮食"（保留用户在自动内容后手动追加的文字）
 * 模型：最终内容 = 自动部分（来自消费备注） + 手动后缀（用户自己敲的）
 * 用「今日饮食自动」精确记住上一次自动写入的部分，每次整体替换该部分，
 * 绝不把逐字符输入累积成重复片段。 */
function syncDietLine(){
  var e = getEntry();
  var thoughts = normalizeThoughts(e);
  var want = dietFromExpenses(e);           /* 本次应有的自动部分 */
  var c = $("sk-diet-c");
  if(!c) return;
  var cur = htmlText(c.innerHTML);          /* 当前显示的全部文字 */
  var oldAuto = htmlText(thoughts["今日饮食自动"] || "");  /* 上一次自动写入的部分 */

  /* 计算"手动后缀"：从当前内容中剥掉上一次的自动部分，剩下的就是用户手写的 */
  var manual = cur;
  if(oldAuto && cur.indexOf(oldAuto) === 0){
    manual = cur.slice(oldAuto.length);
  }else if(oldAuto && cur.indexOf(oldAuto) > 0){
    /* 自动部分不在开头（用户可能在前/后都写了），按出现位置切除 */
    manual = cur.slice(0, cur.indexOf(oldAuto)) + cur.slice(cur.indexOf(oldAuto) + oldAuto.length);
  }
  manual = manual.replace(/^[；;\s]+/, "").replace(/[；;\s]+$/, "");

  /* 拼接：自动部分 + 手动后缀（都没有则为空） */
  var parts = [];
  if(want) parts.push(want);
  if(manual) parts.push(manual);
  var next = parts.join("；");

  if(next !== cur) c.textContent = next;
  thoughts["今日饮食自动"] = want;
  thoughts["今日饮食"] = cleanFragment(c.innerHTML);
}

/* ---------- 今日基础（单选项） ---------- */
function renderBase(e){
  var box = $("baseList");
  box.innerHTML = "";
  var st = e["今日基础"] || {};
  BASE_ITEMS.forEach(function(name){
    var div = document.createElement("div");
    div.className = "base-item" + (st[name] ? " on" : "");
    div.innerHTML = '<span class="box"></span><span class="name">'+name+'</span>';
    div.addEventListener("click", function(){
      var s = getEntry()["今日基础"];
      s[name] = !s[name];
      renderBase(getEntry());
      touched();
    });
    box.appendChild(div);
  });
}

/* ---------- 表单 ---------- */
function renderForm(){
  var e = getEntry();
  $("inpWeight").value = e["体重"];
  $("inpWords").value = e["英语单词"];
  renderThoughtEditor(e);
  renderExp(e);
  renderBase(e);
  renderHeader();
}

function renderExp(e){
  var list = $("expList"); list.innerHTML = "";
  e["消费"].forEach(function(row, i){
    var div = document.createElement("div");
    div.className = "exp-row";
    var custom = row["类别"]!=="午饭" && row["类别"]!=="晚饭";
    var locked = (row["类别"]==="午饭" || row["类别"]==="晚饭");
    div.innerHTML =
      '<input class="exp-cat'+(custom?' custom':'')+'" maxlength="6" placeholder="类别" value="'+(row["类别"]||"").replace(/"/g,"&quot;")+'">' +
      '<div class="exp-amt-wrap"><span class="yen">¥</span>' +
      '<input class="exp-amt" type="number" inputmode="decimal" step="0.01" placeholder="0" value="'+(row["金额"]===""||row["金额"]==null?"":row["金额"])+'"></div>' +
      '<input class="exp-note" maxlength="60" placeholder="吃了什么 / 买了啥" value="'+((row["备注"]||"").replace(/"/g,"&quot;"))+'">' +
      '<button class="exp-del'+(locked?' locked':'')+'" title="'+(locked?'默认项不可删除':'删除')+'">'+(locked?'锁':'×')+'</button>';
    var catI = div.querySelector(".exp-cat"), amtI = div.querySelector(".exp-amt"),
        noteI = div.querySelector(".exp-note"), delB = div.querySelector(".exp-del");
    catI.addEventListener("input", function(){
      row["类别"] = catI.value;
      catI.classList.toggle("custom", catI.value!=="午饭"&&catI.value!=="晚饭");
      touched(); updateTotal(); syncDietLine();
    });
    amtI.addEventListener("input", function(){
      row["金额"] = amtI.value===""?"":parseFloat(amtI.value)||0;
      touched(); updateTotal(); syncDietLine();
    });
    noteI.addEventListener("input", function(){
      row["备注"] = noteI.value;
      syncDietLine();   /* 实时同步到"今日饮食" */
      touched();
    });
    if(locked){
      delB.addEventListener("click", function(){ toast("午饭/晚饭是默认项，不可删除"); });
    }else{
      delB.addEventListener("click", function(){
        getEntry()["消费"].splice(i,1);
        syncDietLine(); touched(); updateTotal();
        renderExp(getEntry());
      });
    }
    list.appendChild(div);
  });
  updateTotal();
}

/* ---------- 往昔 ---------- */
function renderHistory(){
  var data = load();
  var dates = Object.keys(data).sort().reverse();
  var box = $("histList"); box.innerHTML = "";
  if(dates.length===0){
    box.innerHTML = '<div class="empty serif">还没有任何记录<br>从今天的第一笔开始吧</div>';
    return;
  }
  var lastMonth = "";
  dates.forEach(function(ds){
    var d = new Date(ds+"T00:00:00");
    var m = d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月";
    if(m!==lastMonth){
      lastMonth = m;
      var lab = document.createElement("div");
      lab.className = "month-label serif"; lab.textContent = m;
      box.appendChild(lab);
    }
    var e = data[ds];
    var item = document.createElement("div");
    item.className = "hist-item";
    var chips = "";
    if(e["体重"]!==""&&e["体重"]!=null) chips += '<span class="chip">'+e["体重"]+' kg</span>';
    var t = 0; (e["消费"]||[]).forEach(function(r){ var a=parseFloat(r["金额"]); if(!isNaN(a)) t+=a; });
    if(t>0) chips += '<span class="chip hot">¥'+fmtMoney(t)+'</span>';
    if(e["英语单词"]!==""&&e["英语单词"]!=null) chips += '<span class="chip">今日单词 '+e["英语单词"]+'</span>';
    var bst = e["今日基础"] || {};
    var bdone = BASE_ITEMS.filter(function(k){ return bst[k]; }).length;
    if(bdone > 0) chips += '<span class="chip">基础 '+bdone+'/'+BASE_ITEMS.length+'</span>';
    /* 往昔缩略只取“今日感悟”，不混入饮食、昨日感悟或自由记录 */
    var preview = htmlText(normalizeThoughts(e)["今日感悟"]);
    item.innerHTML =
      '<div class="hist-day serif">'+d.getDate()+'号<small>周'+WD[d.getDay()]+'</small></div>' +
      '<div class="hist-meta"><div class="hist-chips">'+(chips||'<span class="chip">空白一页</span>')+'</div>' +
      (preview?'<div class="hist-feel">'+escHtml(preview.slice(0,60))+'</div>':"") + '</div>';
    item.addEventListener("click", function(){ openDetail(ds); });
    box.appendChild(item);
  });
}

function dayLabel(ds){ return parseInt(ds.slice(5,7),10)+"/"+parseInt(ds.slice(8,10),10); }
function monthLabel(m){ return parseInt(m.slice(5,7),10)+"月"; }
/* 按日/月聚合：agg='avg' 取均值（体重），'sum' 取合计（消费/单词） */
function collect(data, dates, mode, pick, agg){
  var pts = [];
  if(mode === "day"){
    dates.forEach(function(ds){
      var v = pick(data[ds]);
      if(v === null || v === undefined || isNaN(v)) return;
      pts.push({ label: dayLabel(ds), value: agg === "avg" ? v : Math.round(v*100)/100 });
    });
    return pts.slice(-30);
  }
  var byMonth = {};
  dates.forEach(function(ds){
    var v = pick(data[ds]);
    if(v === null || v === undefined || isNaN(v)) return;
    var m = ds.slice(0,7);
    if(!byMonth[m]) byMonth[m] = { sum:0, n:0 };
    byMonth[m].sum += v; byMonth[m].n++;
  });
  Object.keys(byMonth).sort().forEach(function(m){
    var o = byMonth[m];
    pts.push({ label: monthLabel(m), value: Math.round((agg === "avg" ? o.sum/o.n : o.sum)*10)/10 });
  });
  return pts.slice(-12);
}
function pickWeight(e){ var v = parseFloat(e["体重"]); return isNaN(v) ? null : v; }
function pickSpend(e){
  var t = 0, has = false;
  (e["消费"]||[]).forEach(function(r){ var a = parseFloat(r["金额"]); if(!isNaN(a)){ t += a; has = true; } });
  return has ? Math.round(t*100)/100 : null;
}
function pickWords(e){ var v = parseInt(e["英语单词"],10); return (isNaN(v) || v<=0) ? null : v; }

function renderCharts(){
  var data = load();
  var dates = Object.keys(data).sort();

  var wpts = collect(data, dates, chartMode.weight, pickWeight, "avg");
  $("chartWeight").innerHTML = wpts.length ? lineChart(wpts, "#b3442f", "kg") : '<div class="chart-empty">暂无体重数据</div>';

  var spts = collect(data, dates, chartMode.spend, pickSpend, "sum");
  $("chartSpend").innerHTML = spts.length ? lineChart(spts, "#3a6ea5", "元") : '<div class="chart-empty">暂无消费数据</div>';

  var dpts = collect(data, dates, chartMode.words, pickWords, "sum");
  $("chartWords").innerHTML = dpts.length ? barChart(dpts, "#b3442f") : '<div class="chart-empty">暂无单词数据</div>';
}

function niceCeil(v){
  if(v<=5) return 5;
  var p = Math.pow(10, Math.floor(Math.log10(v)));
  var n = v/p;
  var m = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return m*p;
}
function lineChart(points, color, unit){
  var W=340,H=150,padL=38,padR=14,padT=14,padB=24;
  var iw=W-padL-padR, ih=H-padT-padB;
  var vals = points.map(function(p){return p.value;});
  var vmin=Math.min.apply(null,vals), vmax=Math.max.apply(null,vals);
  if(vmin===vmax){ vmin-=1; vmax+=1; }
  var span = vmax-vmin; vmin -= span*0.15; vmax += span*0.15;
  if(vmin<0 && Math.min.apply(null,vals)>=0) vmin=0;
  function X(i){ return points.length===1 ? padL+iw/2 : padL + iw*i/(points.length-1); }
  function Y(v){ return padT + ih*(1-(v-vmin)/(vmax-vmin)); }
  var s = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(var g=0; g<=3; g++){
    var gv = vmin+(vmax-vmin)*g/3, gy = Y(gv);
    s += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="#e7dcc7" stroke-width="1" stroke-dasharray="3 4"/>';
    s += '<text x="'+(padL-5)+'" y="'+(gy+3)+'" font-size="8.5" fill="#b3a68e" text-anchor="end">'+(Math.round(gv*10)/10)+'</text>';
  }
  var step = Math.ceil(points.length/6);
  points.forEach(function(p,i){
    if(i%step===0 || i===points.length-1){
      s += '<text x="'+X(i)+'" y="'+(H-8)+'" font-size="8.5" fill="#b3a68e" text-anchor="middle">'+p.label+'</text>';
    }
  });
  if(points.length>1){
    var d = "M"+points.map(function(p,i){ return X(i).toFixed(1)+" "+Y(p.value).toFixed(1); }).join(" L");
    s += '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  points.forEach(function(p,i){
    s += '<circle cx="'+X(i)+'" cy="'+Y(p.value)+'" r="2.6" fill="#fffdf7" stroke="'+color+'" stroke-width="1.8"/>';
  });
  var last = points[points.length-1];
  s += '<text x="'+Math.min(X(points.length-1),W-padR)+'" y="'+(Y(last.value)-7)+'" font-size="9.5" font-weight="700" fill="'+color+'" text-anchor="end">'+last.value+(unit||"")+'</text>';
  s += '</svg>';
  return s;
}
function barChart(points, color){
  var W=340,H=150,padL=38,padR=14,padT=14,padB=24;
  var iw=W-padL-padR, ih=H-padT-padB;
  var vmax = niceCeil(Math.max.apply(null, points.map(function(p){return p.value;})));
  var s = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(var g=0; g<=3; g++){
    var gv = vmax*g/3, gy = padT+ih*(1-g/3);
    s += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="#e7dcc7" stroke-width="1" stroke-dasharray="3 4"/>';
    s += '<text x="'+(padL-5)+'" y="'+(gy+3)+'" font-size="8.5" fill="#b3a68e" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  var bw = Math.min(18, iw/points.length*0.55);
  var step = Math.ceil(points.length/6);
  points.forEach(function(p,i){
    var cx = padL + iw*(i+0.5)/points.length;
    var bh = ih*p.value/vmax;
    s += '<rect x="'+(cx-bw/2)+'" y="'+(padT+ih-bh)+'" width="'+bw+'" height="'+Math.max(bh,1)+'" rx="3" fill="'+color+'" opacity="'+(0.55+0.45*p.value/vmax)+'"/>';
    if(i%step===0 || i===points.length-1){
      s += '<text x="'+cx+'" y="'+(H-8)+'" font-size="8.5" fill="#b3a68e" text-anchor="middle">'+p.label+'</text>';
    }
  });
  var last = points[points.length-1];
  s += '<text x="'+(W-padR)+'" y="'+(padT+2)+'" font-size="9.5" font-weight="700" fill="'+color+'" text-anchor="end">'+last.value+'个</text>';
  s += '</svg>';
  return s;
}

/* ---------- 云同步 ---------- */
var syncing = false;
function getCode(){ return localStorage.getItem(CODE_KEY) || ""; }
function setSyncStatus(text, cls){
  var el = $("syncStatus");
  el.textContent = text;
  el.className = "sync-status" + (cls?" "+cls:"");
}
function refreshSyncUI(){
  var code = getCode();
  $("syncCode").value = code;
  $("btnSyncSave").textContent = code ? "更新" : "开启";
  $("btnSyncNow").style.display = code ? "block" : "none";
  $("btnSyncOff").style.display = code ? "block" : "none";
  var t = localStorage.getItem(SYNCTIME_KEY);
  setSyncStatus(code ? (t ? "已开启 · 上次同步 "+t : "已开启，尚未同步") : "未开启云同步，数据仅保存在本机", code?"ok":"");
}
function mergeDiary(local, cloud){
  var out = {}, keys = {};
  Object.keys(local).forEach(function(k){ keys[k]=1; });
  Object.keys(cloud).forEach(function(k){ keys[k]=1; });
  Object.keys(keys).forEach(function(k){
    var a = local[k], b = cloud[k];
    if(a && !b){ out[k]=a; return; }
    if(b && !a){ out[k]=b; return; }
    var ta = Date.parse(a["更新时间"]||0)||0;
    var tb = Date.parse(b["更新时间"]||0)||0;
    out[k] = ta>=tb ? a : b;
  });
  return out;
}
function syncNow(manual){
  var code = getCode();
  if(!code || syncing){ if(manual && !code) toast("请先输入同步口令"); return; }
  syncing = true;
  setSyncStatus("同步中…");
  fetch("api/sync/"+encodeURIComponent(code))
    .then(function(r){ return r.json(); })
    .then(function(cloud){
      var merged = mergeDiary(load(), (cloud && cloud["日记"]) || {});
      saveAll(merged);
      return fetch("api/sync/"+encodeURIComponent(code), {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({"日记": merged})
      });
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      syncing = false;
      localStorage.setItem(SYNCTIME_KEY, res["云端更新时间"]||"");
      setSyncStatus("已开启 · 上次同步 "+(res["云端更新时间"]||""), "ok");
      resetCurrent();
      if(manual){ renderForm(); toast("同步完成"); }
    })
    .catch(function(){
      syncing = false;
      setSyncStatus("同步失败，请检查网络", "err");
      if(manual) toast("同步失败");
    });
}
$("btnSyncSave").addEventListener("click", function(){
  var v = $("syncCode").value.trim();
  if(!v){ toast("请输入同步口令"); return; }
  localStorage.setItem(CODE_KEY, v);
  refreshSyncUI();
  syncNow(true);
});
$("btnSyncNow").addEventListener("click", function(){ syncNow(true); });
$("btnSyncOff").addEventListener("click", function(){
  confirmSheet("关闭云同步", "关闭后数据只保留在本机，云端备份不会被删除。", "关闭", function(){
    localStorage.removeItem(CODE_KEY);
    localStorage.removeItem(SYNCTIME_KEY);
    refreshSyncUI();
    toast("已关闭云同步");
  });
});

/* ---------- 导出 / 导入 ---------- */
function importThoughts(src, entry){
  var thoughts = blankThoughts();
  var rich = src["感想富文本"];
  if(rich && typeof rich === "object" && !Array.isArray(rich)){
    thoughts["今日饮食"] = cleanFragment(rich["今日饮食"] || "");
    thoughts["今日感悟"] = cleanFragment(rich["今日感悟"] || "");
    thoughts["自由记录"] = cleanFragment(rich["自由记录"] || "");
  }else if(typeof rich === "string" && rich){
    thoughts = legacyThoughts(rich);
  }else{
    var plain = src["感想"] && typeof src["感想"] === "object" ? src["感想"] : {};
    var diet = plain["今日饮食"] != null ? plain["今日饮食"] : src["今日饮食"];
    var feel = plain["今日感悟"] != null ? plain["今日感悟"] : src["今日感悟"];
    var free = plain["自由记录"] != null ? plain["自由记录"] : src["自由记录"];
    /* 兼容更早的“感想”为纯文本格式：整段视为今日感悟 */
    if(feel == null && typeof src["感想"] === "string") feel = src["感想"];
    thoughts["今日饮食"] = escHtml(diet == null ? "" : String(diet));
    thoughts["今日感悟"] = escHtml(feel == null ? "" : String(feel));
    thoughts["自由记录"] = escHtml(free == null ? "" : String(free));
  }
  thoughts["今日饮食自动"] = dietFromExpenses(entry);
  return thoughts;
}
$("btnExport").addEventListener("click", function(){
  var data = load();
  if(Object.keys(data).length===0){ toast("还没有数据可导出"); return; }
  var out = { "应用":"一日手账", "导出版本":3, "导出时间":"", "日记":{} };
  var n = new Date();
  out["导出时间"] = dateStr(n)+" "+pad(n.getHours())+":"+pad(n.getMinutes());
  Object.keys(data).sort().forEach(function(ds){
    var e = data[ds];
    var thoughts = normalizeThoughts(e);
    var prev = prevThoughtFor(ds);
    var total = 0;
    (e["消费"]||[]).forEach(function(r){
      var a = parseFloat(r["金额"]); if(!isNaN(a)) total += a;
    });
    out["日记"][ds] = {
      "体重": e["体重"]===""?null:e["体重"],
      "体重单位": "kg",
      "今日单词": e["英语单词"]===""?null:e["英语单词"],
      "今日基础": (function(){
        var o = {}, st = e["今日基础"] || {};
        BASE_ITEMS.forEach(function(k){ o[k] = !!st[k]; });
        return o;
      })(),
      "今日锻炼": e["今日锻炼"] || "",
      "消费": (e["消费"]||[]).map(function(r){
        return { "类别":r["类别"]||"其他", "金额":(r["金额"]===""||r["金额"]==null)?null:r["金额"], "金额单位":"元", "备注":r["备注"]||"" };
      }),
      "消费合计": total>0?Math.round(total*100)/100:null,
      "感想": {
        "今日饮食": htmlText(thoughts["今日饮食"]),
        "昨日感悟": prev.text,
        "今日感悟": htmlText(thoughts["今日感悟"]),
        "自由记录": htmlText(thoughts["自由记录"])
      },
      "感想富文本": {
        "今日饮食": thoughts["今日饮食"],
        "今日感悟": thoughts["今日感悟"],
        "自由记录": thoughts["自由记录"]
      },
      "更新时间": e["更新时间"]||null
    };
  });
  var blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "一日手账-"+dateStr(new Date())+".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 JSON 文件");
});

$("btnImport").addEventListener("click", function(){ $("fileImport").click(); });
$("fileImport").addEventListener("change", function(){
  var f = this.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var json = JSON.parse(reader.result);
      var diary = json["日记"] || json;
      if(typeof diary!=="object" || diary===null) throw new Error("bad");
      var data = load(), count = 0;
      Object.keys(diary).forEach(function(ds){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
        var src = diary[ds];
        var entry = blankEntry();
        if(src["体重"]!=null && src["体重"]!=="") entry["体重"] = parseFloat(src["体重"])||"";
        var wv = src["今日单词"] != null ? src["今日单词"] : src["英语单词"];
        if(wv!=null && wv!=="") entry["英语单词"] = parseInt(wv,10)||"";
        if(src["今日基础"] && typeof src["今日基础"] === "object"){
          BASE_ITEMS.forEach(function(k){ entry["今日基础"][k] = !!src["今日基础"][k]; });
        }
        if(src["今日锻炼"] != null) entry["今日锻炼"] = String(src["今日锻炼"]);
        if(Array.isArray(src["消费"]) && src["消费"].length){
          entry["消费"] = src["消费"].map(function(r){
            return { "类别":String(r["类别"]||"其他"), "金额":(r["金额"]==null||r["金额"]==="")?"":(parseFloat(r["金额"])||0), "备注":String(r["备注"]||"") };
          });
        }
        /* v3 使用分区数据；v2/旧版富文本在这里自动迁移，昨日感悟始终重新派生 */
        entry["感想"] = importThoughts(src, entry);
        entry["更新时间"] = src["更新时间"] || new Date().toISOString();
        data[ds] = entry; count++;
      });
      if(count===0) throw new Error("bad");
      saveAll(data);
      resetCurrent();
      renderForm(); renderMe();
      toast("成功导入 "+count+" 天日记");
      syncNow(false);
    }catch(err){
      toast("文件格式不正确，导入失败");
    }
  };
  reader.readAsText(f);
  this.value = "";
});

$("btnClear").addEventListener("click", function(){
  confirmSheet("清空所有数据", "将删除本机保存的全部日记（云端备份不受影响），此操作不可恢复。建议先导出备份。", "全部删除", function(){
    localStorage.removeItem(STORE_KEY);
    editingDate = logicalToday();
    resetCurrent();
    renderForm(); renderMe();
    toast("已清空");
  });
});

/* ---------- PWA ---------- */
var SW_RELOAD_KEY = "一日手账-sw-reload";
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.update();                                  /* 每次打开都主动检查更新 */
    reg.addEventListener("updatefound", function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange", function(){
        if(nw.state === "installed" && navigator.serviceWorker.controller){
          /* 有新版本就自动重载一次（用 sessionStorage 防死循环） */
          if(!sessionStorage.getItem(SW_RELOAD_KEY)){
            sessionStorage.setItem(SW_RELOAD_KEY, "1");
            nw.postMessage({ type:"SKIP_WAITING" });
            window.location.reload();
          }
        }
      });
    });
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!sessionStorage.getItem(SW_RELOAD_KEY)){
      sessionStorage.setItem(SW_RELOAD_KEY, "1");
      window.location.reload();
    }
  });
  /* 页面重新可见时检查一次更新 */
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && navigator.serviceWorker.controller){
      navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); });
    }
  });
}
var deferredPrompt = null;
window.addEventListener("beforeinstallprompt", function(ev){
  ev.preventDefault();
  deferredPrompt = ev;
  $("btnInstall").style.display = "flex";
});
$("btnInstall").addEventListener("click", function(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choice){
    if(choice.outcome==="accepted"){ toast("安装成功"); $("btnInstall").style.display = "none"; }
    deferredPrompt = null;
  });
});
window.addEventListener("appinstalled", function(){ $("btnInstall").style.display = "none"; });

/* 跨过凌晨4点后回到页面，自动切到新的"今天" */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState!=="visible") return;
  var lt = logicalToday();
  if(editingDate!==lt && $("editBanner").style.display==="none"){
    editingDate = lt;
    resetCurrent();
    renderForm();
  }
});

/* ---------- 启动 ---------- */
renderForm();
refreshSyncUI();
if(getCode()) syncNow(false);
})();
</script>
